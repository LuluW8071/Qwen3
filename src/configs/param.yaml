## Model Architecture
# Layers Parameters
d_model: 512
n_heads: 8
n_layers: 6
d_ff: 1536

# Attention Parameters
n_kv_heads: 4
sliding_window: 4096
attention_bias: False
rms_norm_eps: 1e-6
rms_norm: false

# Data Parameters
max_seq_len: 1024
num_documents: 5000
max_tokens: 500000

# Train Parameters
batch_size: 8
max_steps: 100000
gradient_accumulation_steps: 1
muon_lr: 0.01

# Eval Parameters
eval_every: 1000
eval_steps: 250

# Regularization
weight_decay: 0.1
dropout: 0.1
grad_clip: 1.0

# Technical
use_amp: true
device: cpu
vocab_size: null