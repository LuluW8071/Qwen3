[project]
name = "qwen3"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "torch>=2.14.0",
    "lightning>=2.6.0",
    "loguru>=0.7.3",
    "pyyaml>=6.0",
    "datasets>=5.1.0",
    "tokenizers>=0.23.3",
    "huggingface-hub>=2.2.0",
    "comet-ml>=3.53.0",
    "bitsandbytes",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
# feature/muon fork (Muon8bit), pinned to a commit; builds from source (needs nvcc + cmake)
bitsandbytes = { git = "https://github.com/theblackcat102/bitsandbytes", rev = "c80d430a002edd3ef403a128ba3927e6c02a6417" }

# The fork builds CPU-only by default; build the CUDA backend (89 = RTX 40xx, change for other GPUs).
[tool.uv.extra-build-variables]
bitsandbytes = { SKBUILD_CMAKE_ARGS = "-DCOMPUTE_BACKEND=cuda;-DCOMPUTE_CAPABILITY=89" }
